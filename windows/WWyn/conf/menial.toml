# wyn menial. sections follow the team "Windows Hardening" checklist.
# new registry value: copy a block
#   [[reg]]
#   desc = "what it does (shown in output)"
#   hive = "HKLM"              # HKLM or HKCU
#   key  = 'SOFTWARE\...'      # single quotes so \ needs no escaping
#   name = "ValueName"
#   data = 1                   # integer -> REG_DWORD, "string" -> REG_SZ
#
# Nothing here is specific to one round; README-driven choices belong in their own module.

# --- Windows Update ---

[[reg]]
desc = "Windows Update service: automatic start"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Services\wuauserv'
name = "Start"
data = 2

[[reg]]
desc = "Automatic updates: enabled"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
name = "NoAutoUpdate"
data = 0

[[reg]]
desc = "Automatic updates: auto download, notify to install"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
name = "AUOptions"
data = 3

# --- Group Policy ---

[[reg]]
desc = "Disable autoplay on all drives"
hive = "HKLM"
key = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
name = "NoDriveTypeAutoRun"
data = 255

[[reg]]
desc = "Disable autorun"
hive = "HKLM"
key = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
name = "NoAutorun"
data = 1

[[reg]]
desc = "SmartScreen for Explorer: enabled"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\System'
name = "EnableSmartScreen"
data = 1

[[reg]]
desc = "SmartScreen for Explorer: warn"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\System'
name = "ShellSmartScreenLevel"
data = "Warn"

[[reg]]
desc = "Remote Desktop: require SSL security layer"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
name = "SecurityLayer"
data = 2

# --- Firewall ---
# Local settings (what Windows Security toggles), then policy keys (apply after gpupdate /force or reboot).

[[reg]]
desc = "Firewall on: domain profile (local setting)"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile'
name = "EnableFirewall"
data = 1

[[reg]]
desc = "Firewall on: private profile (local setting)"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile'
name = "EnableFirewall"
data = 1

[[reg]]
desc = "Firewall on: public profile (local setting)"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile'
name = "EnableFirewall"
data = 1

[[reg]]
desc = "Firewall on: domain profile"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
name = "EnableFirewall"
data = 1

[[reg]]
desc = "Firewall on: private profile"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile'
name = "EnableFirewall"
data = 1

[[reg]]
desc = "Firewall on: public profile"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile'
name = "EnableFirewall"
data = 1

# --- Action Center (Security Center); most READMEs require it enabled ---
# Set in the registry: the service is protected, so Set-Service is denied even for admins.

[[reg]]
desc = "Security Center service: automatic start"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Services\wscsvc'
name = "Start"
data = 2

[[reg]]
desc = "Notification/Action Center not disabled by policy"
hive = "HKLM"
key = 'SOFTWARE\Policies\Microsoft\Windows\Explorer'
name = "DisableNotificationCenter"
data = 0

# --- Remote Assistance / Remote Desktop ---

[[reg]]
desc = "Disable Remote Assistance"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Control\Remote Assistance'
name = "fAllowToGetHelp"
data = 0

[[reg]]
desc = "Remote Desktop: require Network Level Authentication"
hive = "HKLM"
key = 'SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
name = "UserAuthentication"
data = 1

