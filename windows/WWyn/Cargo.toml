[package]
name = "wyn"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu_no_default_features"] }
# dx12 only: works on GPU-less VMs via WARP, drops vulkan/gles bulk
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std", "parking_lot"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
