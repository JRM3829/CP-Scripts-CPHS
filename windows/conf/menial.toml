# template
#   [[cmd]]
#   desc  = "..."
#   run   = '...'    # ''' for multi-line
#   check = '...'    # optional, true = done

[[cmd]]
desc = "Password policy: min length 12, max age 30, min age 10, history 5"
run = 'net accounts /minpwlen:12 /maxpwage:30 /minpwage:10 /uniquepw:5'

[[cmd]]
desc = "Lockout policy: 5 attempts, 30 min duration, 30 min reset"
run = 'net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30'

[[cmd]]
desc = "Security template: password complexity, no reversible encryption, anonymous SID lookup off, user rights"
run = '''
$inf = "$env:TEMP\wyn-sec.inf"; $db = "$env:TEMP\wyn-sec.sdb"
@'
[Unicode]
Unicode=yes
[Version]
signature="$CHICAGO$"
Revision=1
[System Access]
PasswordComplexity = 1
ClearTextPassword = 0
LSAAnonymousNameLookup = 0
[Privilege Rights]
SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11
SeRemoteInteractiveLogonRight = *S-1-5-32-544
SeDenyNetworkLogonRight = *S-1-5-32-546
SeDenyInteractiveLogonRight = *S-1-5-32-546
SeDenyRemoteInteractiveLogonRight = *S-1-5-32-546
SeTcbPrivilege =
SeCreateTokenPrivilege =
SeDebugPrivilege = *S-1-5-32-544
SeTakeOwnershipPrivilege = *S-1-5-32-544
SeLoadDriverPrivilege = *S-1-5-32-544
SeBackupPrivilege = *S-1-5-32-544
SeRestorePrivilege = *S-1-5-32-544
SeSystemtimePrivilege = *S-1-5-32-544,*S-1-5-19
SeRemoteShutdownPrivilege = *S-1-5-32-544
SeImpersonatePrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20,*S-1-5-6
'@ | Set-Content $inf -Encoding Unicode
Remove-Item $db -ErrorAction SilentlyContinue
secedit /configure /db $db /cfg $inf /quiet
'''

# missing on older win10
[[cmd]]
desc = "Allow Administrator account lockout"
run = '''
$inf = "$env:TEMP\wyn-sec-adm.inf"; $db = "$env:TEMP\wyn-sec-adm.sdb"
@'
[Unicode]
