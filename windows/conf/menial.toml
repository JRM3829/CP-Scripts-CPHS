'@ | Set-Content $inf -Encoding Unicode
Remove-Item $db -ErrorAction SilentlyContinue
secedit /configure /db $db /cfg $inf /quiet
'''

# --- audit policy ---

[[cmd]]
desc = "Audit success and failure for all categories"
run = 'auditpol /set /category:* /success:enable /failure:enable'

# --- accounts ---

[[cmd]]
desc = "Disable built-in Guest (found by SID, so renamed accounts count)"
run = "Get-LocalUser | Where-Object { $_.SID -like '*-501' } | Disable-LocalUser"
check = "-not (Get-LocalUser | Where-Object { $_.SID -like '*-501' -and $_.Enabled })"

[[cmd]]
desc = "Rename built-in Administrator and Guest away from the default names"
run = '''
Get-LocalUser | Where-Object { $_.SID -like '*-500' -and $_.Name -eq 'Administrator' } | Rename-LocalUser -NewName 'LocalAdm'
Get-LocalUser | Where-Object { $_.SID -like '*-501' -and $_.Name -eq 'Guest' } | Rename-LocalUser -NewName 'LocalVisitor'
'''
check = "-not (Get-LocalUser | Where-Object { ($_.SID -like '*-500' -and $_.Name -eq 'Administrator') -or ($_.SID -like '*-501' -and $_.Name -eq 'Guest') })"

# orphaned sids throw
[[cmd]]
desc = "Disable built-in Administrator (only if another enabled admin exists)"
run = '''
$g = [ADSI]("WinNT://$env:COMPUTERNAME/" + (Get-LocalGroup -SID 'S-1-5-32-544').Name + ',group')
$names = $g.Invoke('Members') | ForEach-Object { $_.GetType().InvokeMember('Name', 'GetProperty', $null, $_, $null) }
if (Get-LocalUser | Where-Object { $_.Enabled -and $_.SID -notlike '*-500' -and $names -contains $_.Name }) {
    Get-LocalUser | Where-Object { $_.SID -like '*-500' } | Disable-LocalUser
} else { Write-Error 'no other enabled admin: built-in Administrator left enabled' }
'''
check = "-not (Get-LocalUser | Where-Object { $_.SID -like '*-500' -and $_.Enabled })"

# --- defender & firewall ---

[[cmd]]
desc = "Firewall on for all profiles (takes effect now)"
run = 'netsh advfirewall set allprofiles state on'
check = "-not (Get-NetFirewallProfile -PolicyStore ActiveStore | Where-Object { -not $_.Enabled })"

[[cmd]]
desc = "Firewall: block inbound, allow outbound by default (takes effect now)"
run = 'netsh advfirewall set allprofiles firewallpolicy blockinbound,allowoutbound'
check = "-not (Get-NetFirewallProfile -PolicyStore ActiveStore | Where-Object { $_.DefaultInboundAction -ne 'Block' })"

[[cmd]]
desc = "Defender: real-time, behavior monitoring, download scanning, PUA block, Advanced MAPS (takes effect now)"
run = 'Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -PUAProtection Enabled -MAPSReporting Advanced'
check = "& { $p = Get-MpPreference; -not ($p.DisableRealtimeMonitoring -or $p.DisableBehaviorMonitoring -or $p.DisableIOAVProtection) -and $p.PUAProtection -eq 1 -and $p.MAPSReporting -eq 2 }"

# misses policy exclusions
[[cmd]]
desc = "Remove Defender exclusions set by policy"
run = '''Remove-Item 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Exclusions' -Recurse -Force'''
check = '''-not (Test-Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Exclusions')'''

[[cmd]]
desc = "Remove all Defender exclusions"
run = '''
$p = Get-MpPreference
$p.ExclusionPath      | Where-Object { $_ } | ForEach-Object { Remove-MpPreference -ExclusionPath $_ }
$p.ExclusionExtension | Where-Object { $_ } | ForEach-Object { Remove-MpPreference -ExclusionExtension $_ }
$p.ExclusionProcess   | Where-Object { $_ } | ForEach-Object { Remove-MpPreference -ExclusionProcess $_ }
$p.ExclusionIpAddress | Where-Object { $_ } | ForEach-Object { Remove-MpPreference -ExclusionIpAddress $_ }
'''
check = "& { $p = Get-MpPreference; -not ($p.ExclusionPath -or $p.ExclusionExtension -or $p.ExclusionProcess -or $p.ExclusionIpAddress) }"

[[cmd]]
desc = "Windows Installer: never install elevated (all signed-in users)"
run = '''
Get-ChildItem Registry::HKEY_USERS | ForEach-Object {
    $k = "Registry::$($_.Name)\Software\Policies\Microsoft\Windows\Installer"
    if ((Get-ItemProperty $k -ErrorAction SilentlyContinue).AlwaysInstallElevated) { Set-ItemProperty $k AlwaysInstallElevated 0 }
}
'''
check = '''-not (Get-ChildItem Registry::HKEY_USERS | Where-Object { (Get-ItemProperty "Registry::$($_.Name)\Software\Policies\Microsoft\Windows\Installer" -ErrorAction SilentlyContinue).AlwaysInstallElevated })'''

# --- services ---

[[cmd]]
desc = "Start Windows Update service"
run = 'Start-Service wuauserv'
check = "(Get-Service wuauserv).Status -eq 'Running'"

[[cmd]]
desc = "Start Security Center service (Action Center)"
run = 'Start-Service wscsvc'
check = "(Get-Service wscsvc).Status -eq 'Running'"

[[cmd]]
desc = "Apply group policy (gpupdate /force)"
run = 'gpupdate /force'

# template, readme-dependent, asked last
#   [[ask]]
#   question = "..."
#   check = '...'    # optional, true = skip
#   yes   = '...'    # optional
#   no    = '...'    # optional

[[ask]]
question = "Does the README list Telnet as a critical service?"
check = "-not (Get-Service TlntSvr -ErrorAction SilentlyContinue)"
yes = 'Set-Service TlntSvr -StartupType Automatic; Start-Service TlntSvr'
no = 'Stop-Service TlntSvr -Force; Set-Service TlntSvr -StartupType Disabled'

[[ask]]
question = "Does the README list FTP as a critical service?"
check = "-not (Get-Service FTPSVC -ErrorAction SilentlyContinue)"
yes = 'Set-Service FTPSVC -StartupType Automatic; Start-Service FTPSVC'
no = 'Stop-Service FTPSVC -Force; Set-Service FTPSVC -StartupType Disabled'

[[ask]]
question = "Does the README list IIS (web server) as a critical service?"
check = "-not (Get-Service W3SVC -ErrorAction SilentlyContinue)"
yes = 'Set-Service W3SVC -StartupType Automatic; Start-Service W3SVC'
no = 'Stop-Service W3SVC -Force; Set-Service W3SVC -StartupType Disabled'

[[ask]]
question = "Does the README list SMTP (mail server) as a critical service?"
check = "-not (Get-Service SMTPSVC -ErrorAction SilentlyContinue)"
yes = 'Set-Service SMTPSVC -StartupType Automatic; Start-Service SMTPSVC'
no = 'Stop-Service SMTPSVC -Force; Set-Service SMTPSVC -StartupType Disabled'

[[ask]]
question = "Does the README list DNS server as a critical service?"
check = "-not (Get-Service DNS -ErrorAction SilentlyContinue)"
yes = 'Set-Service DNS -StartupType Automatic; Start-Service DNS'
no = 'Stop-Service DNS -Force; Set-Service DNS -StartupType Disabled'

[[ask]]
question = "Does the README require SMB1 (SMBv1 file sharing)?"
check = '''(Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State -ne 'Enabled' -and (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters').SMB1 -eq 0'''
no = '''
Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' SMB1 0 -Type DWord
Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart | Out-Null
'''

# rdp rule group, any language
[[ask]]
question = "Does the README list Remote Desktop (RDP) as a critical service?"
yes = '''
Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Type DWord
reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' /v fDenyTSConnections /t REG_DWORD /d 0 /f | Out-Null
Enable-NetFirewallRule -Group '@FirewallAPI.dll,-28752'
$inf = "$env:TEMP\wyn-rdp.inf"; $db = "$env:TEMP\wyn-rdp.sdb"
@'
[Unicode]
Unicode=yes
[Version]
signature="$CHICAGO$"
Revision=1
[Privilege Rights]
SeRemoteInteractiveLogonRight = *S-1-5-32-544,*S-1-5-32-555
'@ | Set-Content $inf -Encoding Unicode
Remove-Item $db -ErrorAction SilentlyContinue
secedit /configure /db $db /cfg $inf /quiet
'''
no = '''
Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 1 -Type DWord
reg add 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' /v fDenyTSConnections /t REG_DWORD /d 1 /f | Out-Null
Disable-NetFirewallRule -Group '@FirewallAPI.dll,-28752'
'''
