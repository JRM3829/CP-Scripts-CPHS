#!/usr/bin/env bash

[ -n "${WYN_CONF_LOADED:-}" ] && return 0
WYN_CONF_LOADED=1

export WYN_HOME="${WYN_HOME:-/opt/wyn}"
export MODULES_DIR="${MODULES_DIR:-${WYN_HOME}/modules}"
log_info() {
  printf "[*] %s\n" "$*"
}

readonly HIGH_RISK_THRESHOLD=50

export USER_PASSWORD="${USER_PASSWORD:-}"

readonly -a WHITELIST=(
    "init" "systemd" "kthreadd" "kworker*" "systemd-journald" "rsyslogd"
    "systemd-logind" "systemd-udevd" "dbus-daemon" "upowerd" "NetworkManager"
    "avahi-daemon" "systemd-resolved" "agetty" "login" "sshd" "cron" "anacron"
    "atd" "irqbalance" "cupsd" "snapd" "polkitd" "colord" "udisksd" "accounts-daemon"
    "gnome-shell" "Xorg" "gdm3" "gnome-terminal"
)

readonly -a ARTIFACT_EXTS=(
    "mp3" "mp4" "mov" "avi" "wav" "m4a" "ogg" "flac" "mkv" "wmv"
)

readonly -a CLEANUP_WHITELIST=(
    "/home/*/.cache/mozilla/firefox/*/safebrowsing/*"
    "/home/*/.config/chromium/Safe Browsing/*"
    "/home/*/.config/google-chrome/Safe Browsing/*"
)

readonly -a SOFTWARE_BLACKLIST=(
    "ophcrack" "hydra" "john" "aircrack-ng" "wifite" "nmap" "wireshark"
    "metasploit" "metasploit-framework" "ettercap" "sqlmap" "nikto" "hashcat"
    "masscan" "medusa" "reaver" "bettercap" "beef-xss"
)

readonly -a CRON_PATHS=(
    /etc/crontab /etc/cron.d /etc/cron.daily /etc/cron.hourly
    /etc/cron.weekly /etc/cron.monthly /var/spool/cron
)

readonly -a CRON_BENIGN=(
    ".placeholder" "anacron" "popularity-contest" "e2scrub_all"
    "dpkg" "apt-compat" "man-db" "mlocate" "plocate" "logrotate"
    "update-notifier-common" "0anacron" "bsdmainutils" "cracklib-runtime"
)

# remove entries, not files
readonly -a CRON_SHARED_FILES=( "/etc/crontab" "/var/spool/cron/*" "/etc/anacrontab" )

readonly -a WRITABLE_EXEC_DIRS=(
    "/tmp/*" "/var/tmp/*" "/dev/shm/*" "/run/shm/*"
    "/home/*" "/root/*" "/var/www/*" "/srv/*" "/var/spool/*"
)

readonly -a PERSISTENCE_PATHS=(
    /etc/cron.d /etc/cron.daily /etc/cron.hourly /etc/cron.weekly /etc/cron.monthly
    /etc/crontab /var/spool/cron /etc/systemd/system /lib/systemd/system
    /etc/init.d /etc/rc.local /etc/profile /etc/profile.d /etc/bash.bashrc
    /etc/ld.so.preload /etc/xdg/autostart /etc/update-motd.d
)

readonly -a MALWARE_CONTENT_SIGNATURES=(
    "/dev/tcp/[0-9]"
    "(ba)?sh -i >&"
    "nc( -[a-z]*)* -e "
    "pty\.spawn"
    "socket\.SOCK_STREAM"
    "os\.dup2"
    "UPX!"
    "/etc/ld\.so\.preload"
    "chattr \+i"
    "history -c"
    "(curl|wget)[^|]{0,80}\| *(ba)?sh"
    "base64 (-d|--decode)[^|]{0,40}\| *(ba)?sh"
    "meterpreter|msfvenom|metasploit"
    "authorized_keys"
    "rm -rf /(\s|$)"
)

readonly MAX_SCAN_BYTES=20971520

# score:name:regex
readonly -a SUSPICIOUS_BANNER_SIGNATURES=(
    "100:ID_OUTPUT:uid=[0-9]+\([a-z_-]+\).*gid=[0-9]+\("
    "95:BIND_SHELL_BANNER:(interactive shell|welcome to shell|pwned|backdoor|you are in|shell>)"
    "90:USER_AT_HOST_PROMPT:[a-z_][a-z0-9_-]*@[a-z0-9_.-]+:[^[:space:]]*[#$][[:space:]]*$"
    "90:BARE_ROOT_PROMPT:(^|[[:space:]])#[[:space:]]*$"
    "85:WINDOWS_CMD:(Microsoft Windows \[Version|^[A-Za-z]:\\\\[^[:space:]]*>)"
    "80:SUSPICIOUS_DAEMON:(custom_shell_daemon|netcat|nc_listener|remote_exec|meterpreter)"
    "60:SUSPICIOUS_LOGIN_PROMPT:^(login|password)[[:space:]]*:[[:space:]]*$"
)

readonly PROBE_TIMEOUT="${PROBE_TIMEOUT:-6}"      # whole probe exchange
readonly PROBE_READ_TIMEOUT="${PROBE_READ_TIMEOUT:-2}"
readonly BANNER_TIMEOUT="${BANNER_TIMEOUT:-3}"    # whole banner grab
readonly BANNER_READ_TIMEOUT="${BANNER_READ_TIMEOUT:-1}"
