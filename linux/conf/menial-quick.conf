# file|search|replace|check
# cmd checks optional

CMD | harden /etc/shadow | chmod 640 /etc/shadow | [ "$(stat -c %a /etc/shadow 2>/dev/null)" = "640" ]
CMD | harden /etc/passwd | chmod 644 /etc/passwd | [ "$(stat -c %a /etc/passwd 2>/dev/null)" = "644" ]
CMD | harden /etc/group | chmod 644 /etc/group | [ "$(stat -c %a /etc/group 2>/dev/null)" = "644" ]
CMD | harden /etc/gshadow | chmod 640 /etc/gshadow | [ "$(stat -c %a /etc/gshadow 2>/dev/null)" = "640" ]
CMD | harden /etc/sudoers | chmod 440 /etc/sudoers | [ "$(stat -c %a /etc/sudoers 2>/dev/null)" = "440" ]
CMD | harden /etc/cron.d | chmod 755 /etc/cron.d | [ "$(stat -c %a /etc/cron.d 2>/dev/null)" = "755" ]
CMD | harden temp dir sticky bits | chmod 1777 /tmp /var/tmp | [ "$(stat -c %a /tmp 2>/dev/null)" = "1777" ]
CMD | strip suid risk tools | chmod u-s /usr/bin/python* /usr/bin/perl /usr/bin/gcc /usr/bin/nc /usr/bin/ncat /usr/bin/netcat /usr/bin/vim /usr/bin/find /usr/bin/env /usr/bin/awk 2>/dev/null; true | true

CMD | restrict home directories (700) | chmod 700 /home/* | [ -z "$(find /home -maxdepth 1 -mindepth 1 -type d -perm /077 2>/dev/null)" ]
CMD | restrict cron period dirs (755) | chmod 755 /etc/cron.daily /etc/cron.weekly /etc/cron.monthly; chmod 644 /etc/crontab | for d in /etc/cron.daily /etc/cron.weekly /etc/cron.monthly; do [ "$(stat -c %a "$d" 2>/dev/null)" = "755" ] || exit 1; done; [ "$(stat -c %a /etc/crontab 2>/dev/null)" = "644" ]
CMD | convert group passwords to shadow (grpconv) | grpconv; grpck -r | [ -f /etc/gshadow ]
CMD | harden grub configuration (600) | chmod 600 /boot/grub/grub.cfg 2>/dev/null; true | [ "$(stat -c %a /boot/grub/grub.cfg 2>/dev/null)" = "600" ] && exit 0; [ ! -e /boot/grub/grub.cfg ] && exit 0; exit 1

CMD | install faillock profile | install -m 644 "${WYN_HOME}/conf/pam/faillock" /usr/share/pam-configs/faillock | cmp -s "${WYN_HOME}/conf/pam/faillock" /usr/share/pam-configs/faillock
CMD | install faillock-notify profile | install -m 644 "${WYN_HOME}/conf/pam/faillock-notify" /usr/share/pam-configs/faillock-notify | cmp -s "${WYN_HOME}/conf/pam/faillock-notify" /usr/share/pam-configs/faillock-notify
CMD | enable faillock via pam-auth-update | DEBIAN_FRONTEND=noninteractive pam-auth-update --enable faillock faillock-notify --package | grep -q "pam_faillock.so" /etc/pam.d/common-auth 2>/dev/null
CMD | harden common-password (minlen, no nullok) | "${WYN_HOME}/libs/pam.sh" enforce /etc/pam.d/common-password 'password [success=@ default=ignore] pam_unix.so obscure sha512 minlen=10 remember=3' | "${WYN_HOME}/libs/pam.sh" check /etc/pam.d/common-password 'password [success=@ default=ignore] pam_unix.so obscure sha512 minlen=10 remember=3'
CMD | harden common-auth (no nullok) | "${WYN_HOME}/libs/pam.sh" enforce /etc/pam.d/common-auth 'auth [success=@ default=ignore] pam_unix.so try_first_pass' | "${WYN_HOME}/libs/pam.sh" check /etc/pam.d/common-auth 'auth [success=@ default=ignore] pam_unix.so try_first_pass'

/etc/sysctl.conf | net.ipv4.tcp_syncookies | net.ipv4.tcp_syncookies = 1
/etc/sysctl.conf | net.ipv4.ip_forward | net.ipv4.ip_forward = 0
/etc/sysctl.conf | kernel.randomize_va_space | kernel.randomize_va_space = 2
/etc/sysctl.conf | net.ipv4.conf.all.accept_redirects | net.ipv4.conf.all.accept_redirects = 0
/etc/sysctl.conf | net.ipv4.conf.default.accept_redirects | net.ipv4.conf.default.accept_redirects = 0
/etc/sysctl.conf | net.ipv4.conf.all.secure_redirects | net.ipv4.conf.all.secure_redirects = 0
/etc/sysctl.conf | net.ipv4.conf.all.send_redirects | net.ipv4.conf.all.send_redirects = 0
/etc/sysctl.conf | net.ipv4.conf.all.accept_source_route | net.ipv4.conf.all.accept_source_route = 0
CMD | reload sysctl to apply changes | sysctl -p >/dev/null | [ "$(sysctl -n net.ipv4.ip_forward 2>/dev/null)" = "0" ] && [ "$(sysctl -n net.ipv4.tcp_syncookies 2>/dev/null)" = "1" ] && [ "$(sysctl -n kernel.randomize_va_space 2>/dev/null)" = "2" ]

/etc/login.defs | PASS_MAX_DAYS | PASS_MAX_DAYS 30
/etc/login.defs | PASS_MIN_DAYS | PASS_MIN_DAYS 10
/etc/login.defs | PASS_WARN_AGE | PASS_WARN_AGE 7
CMD | enforce password aging for interactive users | if [ -n "${SUDO_USER:-}" ]; then if ! chage -d "$(date +%F)" "$SUDO_USER"; then exit 1; fi; fi; while IFS= read -r u; do if ! chage -M 30 -m 10 -W 7 "$u" 2>/dev/null; then exit 1; fi; done < <(awk -F: '$3==0 && $1!="root" {print $1; next} $1!="nobody" && (($3>=1000)+($6 ~ "^/home/")>0) && $7 !~ /nologin$/ && $7 !~ /false$/ {print $1}' /etc/passwd) | while IFS= read -r u; do [ "$(chage -l "$u" 2>/dev/null | awk -F: '/Maximum number of days/ {print $2}' | tr -d ' ')" = "30" ] || exit 1; done < <(awk -F: '$3==0 && $1!="root" {print $1; next} $1!="nobody" && (($3>=1000)+($6 ~ "^/home/")>0) && $7 !~ /nologin$/ && $7 !~ /false$/ {print $1}' /etc/passwd)

/etc/ssh/sshd_config | PermitRootLogin | PermitRootLogin no
/etc/ssh/sshd_config | PermitEmptyPasswords | PermitEmptyPasswords no
/etc/ssh/sshd_config | Protocol | Protocol 2
/etc/ssh/sshd_config | X11Forwarding | X11Forwarding no
/etc/ssh/sshd_config | MaxAuthTries | MaxAuthTries 3
/etc/ssh/sshd_config | IgnoreRhosts | IgnoreRhosts yes
/etc/ssh/sshd_config | HostKey /etc/ssh/ssh_host_ed25519_key | HostKey /etc/ssh/ssh_host_ed25519_key
CMD | neutralize sshd drop-in overrides | for f in /etc/ssh/sshd_config.d/*.conf; do [ -f "$f" ] && sed -i 's/^[[:space:]]*PermitRootLogin.*/PermitRootLogin no/; s/^[[:space:]]*PermitEmptyPasswords.*/PermitEmptyPasswords no/' "$f"; done; true | [ ! -d /etc/ssh/sshd_config.d ] || ! grep -RqE "^[[:space:]]*(PermitRootLogin|PermitEmptyPasswords)[[:space:]]+yes" /etc/ssh/sshd_config.d/ 2>/dev/null
CMD | ensure SSH host keys exist when needed | source "${WYN_HOME}/libs/readme.sh"; need=false; [ -f /etc/ssh/sshd_config ] && need=true; if readme_load 2>/dev/null; then if readme_service_required sshd; then need=true; elif readme_service_required ssh; then need=true; fi; fi; if [ "$need" = true ] && [ ! -e /etc/ssh/ssh_host_ed25519_key ]; then ssh-keygen -A; fi | source "${WYN_HOME}/libs/readme.sh"; need=false; [ -f /etc/ssh/sshd_config ] && need=true; if readme_load 2>/dev/null && { readme_service_required sshd || readme_service_required ssh; }; then need=true; fi; [ "$need" = false ] || [ -e /etc/ssh/ssh_host_ed25519_key ]
CMD | lock root password | passwd -dl root | passwd -S root 2>/dev/null | awk '{print $2}' | grep -q "^L$"
CMD | set root shell to nologin | usermod -s /usr/sbin/nologin root | [ "$(getent passwd root | cut -d: -f7)" = "/usr/sbin/nologin" ]
CMD | reload sshd to apply changes | source "${WYN_HOME}/libs/readme.sh"; need=false; [ -f /etc/ssh/sshd_config ] && need=true; if readme_load 2>/dev/null; then if readme_service_required sshd; then need=true; elif readme_service_required ssh; then need=true; fi; fi; if [ "$need" = true ]; then systemctl reload ssh 2>/dev/null; systemctl reload sshd 2>/dev/null; true; fi | [ ! -f /etc/ssh/sshd_config ] || grep -Eq "^[[:space:]]*PermitRootLogin[[:space:]]+no([[:space:]]|$)" /etc/ssh/sshd_config

CMD | configure ufw from README critical services | "${WYN_HOME}/libs/firewall.sh"
CMD | sync accounts to the README authorized list | "${WYN_HOME}/libs/users.sh" -y

CMD | install auditd | "${WYN_HOME}/libs/audit.sh" install | "${WYN_HOME}/libs/audit.sh" installed
CMD | install STIG/CIS audit ruleset | "${WYN_HOME}/libs/audit.sh" install-rules | "${WYN_HOME}/libs/audit.sh" rules-installed
CMD | load audit rules (augenrules, immutable) | "${WYN_HOME}/libs/audit.sh" load | "${WYN_HOME}/libs/audit.sh" loaded

CMD | install rsyslog | DEBIAN_FRONTEND=noninteractive apt-get install -y rsyslog | dpkg -s rsyslog >/dev/null 2>&1
CMD | ensure rsyslog is running | pgrep -x rsyslogd >/dev/null 2>&1 && exit 0; service rsyslog start 2>/dev/null; sleep 1; pgrep -x rsyslogd >/dev/null 2>&1 && exit 0; systemctl start rsyslog 2>/dev/null; sleep 1; pgrep -x rsyslogd >/dev/null 2>&1 && exit 0; rsyslogd 2>/dev/null; sleep 1; pgrep -x rsyslogd >/dev/null 2>&1 && exit 0; exit 1 | pgrep -x rsyslogd >/dev/null 2>&1 && exit 0; exit 1

CMD | install or upgrade required vsftpd | source "${WYN_HOME}/libs/readme.sh"; if readme_load 2>/dev/null && readme_service_required vsftpd; then DEBIAN_FRONTEND=noninteractive apt-get install -y vsftpd openssl; fi | source "${WYN_HOME}/libs/readme.sh"; ! readme_load 2>/dev/null || ! readme_service_required vsftpd || { dpkg -s vsftpd >/dev/null 2>&1 && dpkg -s openssl >/dev/null 2>&1; }
/etc/vsftpd.conf | ssl_enable | ssl_enable=YES
/etc/vsftpd.conf | rsa_cert_file | rsa_cert_file=/etc/ssl/private/vsftpd.pem
/etc/vsftpd.conf | rsa_private_key_file | rsa_private_key_file=/etc/ssl/private/vsftpd.pem
/etc/vsftpd.conf | anonymous_enable | anonymous_enable=NO
/etc/vsftpd.conf | allow_anon_ssl | allow_anon_ssl=NO
/etc/vsftpd.conf | force_local_data_ssl | force_local_data_ssl=YES
/etc/vsftpd.conf | force_local_logins_ssl | force_local_logins_ssl=YES
/etc/vsftpd.conf | ssl_tlsv1 | ssl_tlsv1=YES
/etc/vsftpd.conf | ssl_sslv2 | ssl_sslv2=NO
/etc/vsftpd.conf | ssl_sslv3 | ssl_sslv3=NO
CMD | generate vsftpd SSL certificate | if dpkg -s vsftpd >/dev/null 2>&1; then mkdir -p /etc/ssl/private; if [ ! -f /etc/ssl/private/vsftpd.pem ]; then openssl req -x509 -nodes -days 365 -newkey rsa:2048 -subj "/CN=vsftpd" -keyout /etc/ssl/private/vsftpd.pem -out /etc/ssl/private/vsftpd.pem 2>/dev/null; fi; fi | ! dpkg -s vsftpd >/dev/null 2>&1 || [ -f /etc/ssl/private/vsftpd.pem ]
CMD | restart vsftpd to apply changes | if dpkg -s vsftpd >/dev/null 2>&1; then systemctl restart vsftpd 2>/dev/null; service vsftpd restart 2>/dev/null; true; fi | ! dpkg -s vsftpd >/dev/null 2>&1 || systemctl is-active --quiet vsftpd 2>/dev/null || pgrep -x vsftpd >/dev/null 2>&1
